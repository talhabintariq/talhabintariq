name: Supply-chain scan

# Blocks the exact injection that hit this account on 2026-08-21: an obfuscated
# EtherHiding loader appended to tailwind.config.js / postcss.config.mjs behind
# ~29,900 spaces of padding, with a createRequire shim prepended so it could
# call require() inside an ESM file.
#
# It sat undetected for 11 months because the payload renders off-screen in
# editors and GitHub diffs. This check does not care what it looks like.

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, catches anything pushed while checks were off
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree
        run: |
          set -uo pipefail
          FAIL=0
          PRUNE="-path ./node_modules -prune -o -path ./.git -prune -o -path ./dist -prune -o -path ./build -prune -o -path ./.next -prune -o"

          echo "::group::known payload markers"
          # Obfuscator string-table/decoder names, the hardcoded wallet split across
          # four literals, and the C2 request paths.
          #
          # Scoped to file types that can actually EXECUTE. Prose files are excluded
          # on purpose: security write-ups quote these same indicators, and a payload
          # sitting in a .md cannot run. Matching them would train everyone to ignore
          # this check.
          MARK=$(find . $PRUNE -type f \( \
                   -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.jsx' \
                   -o -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.cts' \
                   -o -name '*.mdx' -o -name '*.vue' -o -name '*.svelte' \
                   -o -name '*.json' -o -name '*.html' -o -name '*.py' -o -name '*.sh' \) -print 2>/dev/null \
                 | grep -vE '\.min\.|-lock\.json$|\.lock$' \
                 | xargs grep -lIE '_0x12f0|_0x355e|a322e5f3|9adc2490ef|d311d3080e|6f0121063e|/0x/ls|/0x/cl' 2>/dev/null || true)
          if [ -n "$MARK" ]; then
            echo "$MARK" | sed 's/^/  /'
            echo "::error::Known malware markers found in executable source."
            FAIL=1
          else
            echo "none"
          fi
          echo "::endgroup::"

          echo "::group::createRequire in a build config"
          # Tailwind/PostCSS/Vite configs have no legitimate reason to shim require().
          HITS=$(find . $PRUNE -type f \( -name '*.config.js' -o -name '*.config.mjs' -o -name '*.config.cjs' -o -name '*.config.ts' \) -print 2>/dev/null \
                 | xargs grep -lI 'createRequire' 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "$HITS" | sed 's/^/  /'
            echo "::error::createRequire found in a build config — that is the injection's header shim."
            FAIL=1
          else
            echo "none"
          fi
          echo "::endgroup::"

          echo "::group::absurdly long lines in config files"
          # The payload hides behind padding on one line. Real configs never do this.
          LONG=$(find . $PRUNE -type f \( -name '*.config.js' -o -name '*.config.mjs' -o -name '*.config.cjs' -o -name '*.config.ts' -o -name '*.config.json' \) -print 2>/dev/null \
                 | while read -r f; do
                     awk -v F="$f" 'length($0)>2000 { print "  " F " line " NR ": " length($0) " chars" }' "$f" 2>/dev/null
                   done)
          if [ -n "$LONG" ]; then
            echo "$LONG"
            echo "::error::Config file contains a line over 2000 chars — payloads hide there."
            FAIL=1
          else
            echo "none"
          fi
          echo "::endgroup::"

          echo "::group::payload padding"
          # The injection buried its loader behind ~29,900 spaces so the line renders
          # as just "};" in an editor. Two thresholds, because ASCII-art console
          # banners legitimately pad 80-100 spaces for alignment:
          #   - any run of 200+ spaces  (the observed attack used 29,900)
          #   - a run of 40+ spaces on a line over 1000 chars (a subtler variant)
          PAD=$(find . $PRUNE -type f \( \
                  -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.jsx' \
                  -o -name '*.ts' -o -name '*.tsx' -o -name '*.mdx' \
                  -o -name '*.vue' -o -name '*.svelte' \) -print 2>/dev/null \
                | { grep -vE '\.min\.' || true; } \
                | while read -r f; do
                    awk -v F="$f" '
                      {
                        if (match($0, / {200,}/)) {
                          print "  " F " line " NR ": run of " RLENGTH " spaces"
                        } else if (length($0) > 1000 && match($0, / {40,}/)) {
                          print "  " F " line " NR ": " length($0) "-char line with a " RLENGTH "-space run"
                        }
                      }' "$f" 2>/dev/null
                  done || true)
          if [ -n "$PAD" ]; then
            echo "$PAD"
            echo "::error::Payload padding detected — source is hiding code off-screen."
            FAIL=1
          else
            echo "none"
          fi
          echo "::endgroup::"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Supply-chain scan FAILED. Do not build, install, or run this checkout."
            exit 1
          fi
          echo "Supply-chain scan passed."
